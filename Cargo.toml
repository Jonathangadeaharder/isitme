[package]
name = "isitme"
version = "0.6.2"
edition = "2024"
description = "Is it me? Diagnose whether your network is the problem in a call (Zoom, Teams, Meet)."
license = "MIT"
repository = "https://github.com/Jonathangadeaharder/isitme"
homepage = "https://github.com/Jonathangadeaharder/isitme"
readme = "README.md"
keywords = ["network", "cli", "zoom", "teams", "diagnostics"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
owo-colors = { version = "4", features = ["supports-colors"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
figlet-rs = "1"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
