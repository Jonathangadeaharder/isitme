[package]
name = "isitme"
version = "0.1.0"
edition = "2024"
description = "Is it me? Diagnose whether your network is the problem in a call."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
owo-colors = { version = "4", features = ["supports-colors"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
