[package]
name = "isitme"
version = "0.1.0"
edition = "2024"
description = "Is it me? Diagnose whether your network is the problem in a call."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
tabled = "0.17"
owo-colors = { version = "4", features = ["supports-colors"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
